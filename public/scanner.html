<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Barang Keluar - PLN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { background-color: #f8f9fa; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: none; }
        #reader video { object-fit: cover; border-radius: 12px; }
        
        .mobile-header {
            background-color: var(--pln-blue, #00A2E9);
            color: white;
            padding: 1rem;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 162, 233, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .scanner-container { padding: 1.5rem; margin-top: 10px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .spacer-40 { width: 40px; }
    </style>
</head>
<body>

    <div class="mobile-header">
        <a href="index.html" class="text-white text-decoration-none p-2" aria-label="Kembali ke Dashboard" title="Kembali">
            <i class="bi bi-arrow-left fs-4"></i>
        </a>
        
        <div class="text-center flex-grow-1 fw-bold">
            <i class="bi bi-upc-scan me-2 text-warning fs-5"></i>Scan Barang Keluar
        </div>
        
        <div class="spacer-40"></div>
    </div>

    <div class="scanner-container">
        <!-- Kotak Kamera Scanner -->
        <div id="reader" class="shadow-sm mb-4 bg-white"></div>

        <!-- Formulir Input Transaksi -->
        <div id="resultCard" class="card shadow-sm d-none">
            <div class="card-body">
                <h6 class="text-muted small mb-1">Barcode Terbaca:</h6>
                <h4 id="scannedSku" class="fw-bold text-primary mb-3">PLN-XXX</h4>
                
                <form id="outboundForm">
                    <div class="mb-3">
                        <label for="refNumber" class="form-label small fw-bold">Nomor Referensi (Surat Tugas)</label>
                        <input type="text" id="refNumber" class="form-control" placeholder="Contoh: ST-2026-07" required title="Masukkan Nomor Referensi Surat Tugas">
                    </div>
                    <div class="mb-3">
                        <label for="qty" class="form-label small fw-bold">Jumlah Diambil</label>
                        <input type="number" id="qty" class="form-control text-center fs-5 fw-bold" min="1" value="1" required title="Masukkan Jumlah Barang yang Diambil">
                    </div>
                    
                    <button type="submit" class="btn btn-warning w-100 fw-bold shadow-sm text-dark mb-2">
                        <i class="bi bi-box-arrow-up-right me-2"></i> Konfirmasi Barang Keluar
                    </button>
                    
                    <button type="button" class="btn btn-outline-secondary w-100" onclick="resetScanner()">
                        Batal & Scan Ulang
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let html5QrCode = null;

        document.addEventListener("DOMContentLoaded", () => {
            // Cek apakah ada parameter SKU dari URL (hasil scan kamera bawaan HP)
            const urlParams = new URLSearchParams(window.location.search);
            const skuParam = urlParams.get('sku');

            if (skuParam) {
                // Langsung tampilkan form pengeluaran barang tanpa menyalakan kamera
                document.getElementById('reader').classList.add('d-none');
                document.getElementById('resultCard').classList.remove('d-none');
                document.getElementById('scannedSku').innerText = skuParam;
            } else {
                // Buka kamera scanner bawaan aplikasi
                html5QrCode = new Html5Qrcode("reader");
                startScanner();
            }
        });

        // Memulai Kamera Belakang Secara Otomatis
        function startScanner() {
            document.getElementById('reader').classList.remove('d-none');
            document.getElementById('resultCard').classList.add('d-none');

            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                alert("Izin kamera ditolak atau kamera belakang tidak terdeteksi.");
                console.error(err);
            });
        }

        // Penanganan Saat Barcode Berhasil Terdeteksi
        function onScanSuccess(decodedText, decodedResult) {
            let sku = decodedText;

            // Jika barcode berisi URL lengkap, ambil nilai parameter 'sku'
            try {
                if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                    const parsedUrl = new URL(decodedText);
                    const urlSku = parsedUrl.searchParams.get('sku');
                    if (urlSku) sku = urlSku;
                }
            } catch (e) {
                sku = decodedText;
            }

            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').classList.add('d-none');
                    document.getElementById('resultCard').classList.remove('d-none');
                    document.getElementById('scannedSku').innerText = sku;
                }).catch(err => console.error(err));
            } else {
                document.getElementById('reader').classList.add('d-none');
                document.getElementById('resultCard').classList.remove('d-none');
                document.getElementById('scannedSku').innerText = sku;
            }
        }

        function onScanFailure(error) {
            // Callback pencarian frame dibiarkan kosong agar performa tetap ringan
        }

        // Reset Formulir dan Pemindai
        function resetScanner() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('sku')) {
                // Jika dibuka via tautan kamera bawaan, kembali ke dashboard
                window.location.href = 'index.html';
            } else {
                document.getElementById('outboundForm').reset();
                startScanner();
            }
        }

        // Kirim Data Transaksi ke Backend
        document.getElementById('outboundForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                sku_barcode: document.getElementById('scannedSku').innerText,
                quantity_taken: parseInt(document.getElementById('qty').value),
                reference_number: document.getElementById('refNumber').value
            };

            const btn = document.querySelector('#outboundForm button[type="submit"]');
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/transactions/outbound`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    alert('✅ Transaksi pengeluaran barang berhasil dicatat!');
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('sku')) {
                        window.location.href = 'index.html';
                    } else {
                        resetScanner();
                    }
                } else {
                    alert(`❌ Gagal: ${result.error}`);
                }
            } catch (error) {
                alert('Terjadi kendala koneksi ke server backend.');
            } finally {
                btn.innerHTML = '<i class="bi bi-box-arrow-up-right me-2"></i> Konfirmasi Barang Keluar';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
